<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ShinyFam – TCG Events, Pokémon-Kunstwerke und Shop für alle Kartenspiel-Fans." />
    <title>ShinyFam – TCG Events & Pokémon Kunstwerke</title>
    <!-- Theme-Initialisierung vor dem Rendern, verhindert Flash -->
    <script>
      (function() {
        const saved = localStorage.getItem('shinyfam-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = saved || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <!-- Skip-Link für Barrierefreiheit -->
    <a href="#main-content" class="skip-link">Zum Hauptinhalt springen</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
