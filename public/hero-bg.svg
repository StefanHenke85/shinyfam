<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <!-- Pokéball shape -->
    <g id="pokeball">
      <!-- outer circle -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.18"/>
      <!-- top half fill -->
      <path d="M -28 0 A 28 28 0 0 1 28 0 Z" fill="currentColor" opacity="0.08"/>
      <!-- center line -->
      <line x1="-28" y1="0" x2="28" y2="0" stroke="currentColor" stroke-width="2" opacity="0.18"/>
      <!-- center button -->
      <circle cx="0" cy="0" r="7" fill="none" stroke="currentColor" stroke-width="2" opacity="0.22"/>
      <circle cx="0" cy="0" r="3" fill="currentColor" opacity="0.15"/>
    </g>
    <!-- TCG card outline -->
    <g id="card">
      <rect x="-18" y="-26" width="36" height="52" rx="4" ry="4" fill="none" stroke="currentColor" stroke-width="2" opacity="0.14"/>
      <rect x="-13" y="-21" width="26" height="30" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="1" opacity="0.09"/>
      <line x1="-13" y1="14" x2="13" y2="14" stroke="currentColor" stroke-width="1" opacity="0.09"/>
      <line x1="-13" y1="18" x2="7" y2="18" stroke="currentColor" stroke-width="1" opacity="0.09"/>
    </g>
    <!-- Lightning bolt (electric type) -->
    <g id="bolt">
      <polygon points="4,-18 -3,-2 3,-2 -4,18 8,0 1,0 8,-18" fill="currentColor" opacity="0.13"/>
    </g>
    <!-- Star / shiny -->
    <g id="star">
      <polygon points="0,-14 3,-5 13,-5 5,1 8,12 0,6 -8,12 -5,1 -13,-5 -3,-5" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.15"/>
    </g>
  </defs>

  <!-- Row 0 -->
  <use href="#pokeball" transform="translate(80,80)" color="#7c3aed"/>
  <use href="#card"     transform="translate(200,60) rotate(8)" color="#e11d48"/>
  <use href="#bolt"     transform="translate(320,90) scale(1.3)" color="#eab308"/>
  <use href="#star"     transform="translate(430,70)" color="#7c3aed"/>
  <use href="#card"     transform="translate(540,85) rotate(-6)" color="#f97316"/>
  <use href="#pokeball" transform="translate(660,75)" color="#e11d48"/>
  <use href="#bolt"     transform="translate(760,90) scale(1.1)" color="#7c3aed"/>

  <!-- Row 1 -->
  <use href="#card"     transform="translate(40,180) rotate(-10)" color="#7c3aed"/>
  <use href="#star"     transform="translate(155,165)" color="#eab308"/>
  <use href="#pokeball" transform="translate(270,185)" color="#f97316"/>
  <use href="#card"     transform="translate(385,170) rotate(5)" color="#7c3aed"/>
  <use href="#bolt"     transform="translate(490,190) scale(1.4)" color="#e11d48"/>
  <use href="#pokeball" transform="translate(600,175)" color="#eab308"/>
  <use href="#star"     transform="translate(720,185)" color="#f97316"/>

  <!-- Row 2 -->
  <use href="#bolt"     transform="translate(100,285) scale(1.2)" color="#e11d48"/>
  <use href="#pokeball" transform="translate(210,270)" color="#7c3aed"/>
  <use href="#star"     transform="translate(330,290) scale(1.2)" color="#f97316"/>
  <use href="#card"     transform="translate(450,275) rotate(-8)" color="#eab308"/>
  <use href="#pokeball" transform="translate(565,285)" color="#e11d48"/>
  <use href="#card"     transform="translate(680,270) rotate(12)" color="#7c3aed"/>
  <use href="#bolt"     transform="translate(775,290) scale(1.1)" color="#eab308"/>

  <!-- Row 3 -->
  <use href="#star"     transform="translate(55,380)" color="#7c3aed"/>
  <use href="#card"     transform="translate(165,365) rotate(7)" color="#f97316"/>
  <use href="#bolt"     transform="translate(285,385) scale(1.3)" color="#7c3aed"/>
  <use href="#pokeball" transform="translate(400,370)" color="#eab308"/>
  <use href="#star"     transform="translate(510,380) scale(1.1)" color="#e11d48"/>
  <use href="#card"     transform="translate(625,365) rotate(-9)" color="#7c3aed"/>
  <use href="#pokeball" transform="translate(740,380)" color="#f97316"/>

  <!-- Row 4 -->
  <use href="#pokeball" transform="translate(90,470)" color="#e11d48"/>
  <use href="#star"     transform="translate(205,485) scale(1.2)" color="#7c3aed"/>
  <use href="#card"     transform="translate(320,465) rotate(-5)" color="#eab308"/>
  <use href="#bolt"     transform="translate(430,480) scale(1.4)" color="#f97316"/>
  <use href="#pokeball" transform="translate(545,470)" color="#7c3aed"/>
  <use href="#card"     transform="translate(660,480) rotate(10)" color="#e11d48"/>
  <use href="#star"     transform="translate(765,470)" color="#eab308"/>

  <!-- Row 5 -->
  <use href="#card"     transform="translate(45,570) rotate(8)" color="#7c3aed"/>
  <use href="#bolt"     transform="translate(155,565) scale(1.2)" color="#eab308"/>
  <use href="#pokeball" transform="translate(270,575)" color="#f97316"/>
  <use href="#star"     transform="translate(390,560) scale(1.1)" color="#e11d48"/>
  <use href="#card"     transform="translate(505,570) rotate(-7)" color="#7c3aed"/>
  <use href="#bolt"     transform="translate(615,565) scale(1.3)" color="#f97316"/>
  <use href="#pokeball" transform="translate(730,575)" color="#eab308"/>

  <!-- Row 6 -->
  <use href="#star"     transform="translate(80,665)" color="#f97316"/>
  <use href="#pokeball" transform="translate(195,675)" color="#7c3aed"/>
  <use href="#card"     transform="translate(310,660) rotate(-11)" color="#eab308"/>
  <use href="#bolt"     transform="translate(420,670) scale(1.4)" color="#e11d48"/>
  <use href="#star"     transform="translate(535,665) scale(1.2)" color="#7c3aed"/>
  <use href="#card"     transform="translate(650,675) rotate(6)" color="#f97316"/>
  <use href="#pokeball" transform="translate(765,665)" color="#e11d48"/>

  <!-- Row 7 -->
  <use href="#bolt"     transform="translate(50,760) scale(1.1)" color="#7c3aed"/>
  <use href="#card"     transform="translate(165,750) rotate(9)" color="#e11d48"/>
  <use href="#star"     transform="translate(280,765)" color="#f97316"/>
  <use href="#pokeball" transform="translate(395,755)" color="#eab308"/>
  <use href="#bolt"     transform="translate(510,760) scale(1.2)" color="#7c3aed"/>
  <use href="#star"     transform="translate(625,750) scale(1.1)" color="#e11d48"/>
  <use href="#card"     transform="translate(740,765) rotate(-8)" color="#f97316"/>
</svg>
